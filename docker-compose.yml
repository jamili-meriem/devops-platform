services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shortly
      POSTGRES_PASSWORD: shortly_pass
      POSTGRES_DB: shortly
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortly -d shortly"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://shortly:shortly_pass@db:5432/shortly
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  db_data:
